{% extends "base.html" %}
{% block title %}Table Layout — Print — Chevalier Events{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Table Layout — {{ event.title }}</h1>
  <div style="display:flex; align-items:center; gap:.6rem;">
    <a href="{{ url_for('seating.print_seating', event_id=event.id) }}" class="btn btn-outline">
      ← Back to Print/Export
    </a>
    <button type="button" class="btn btn-gold" onclick="printLayout()">🖨 Print</button>
  </div>
</div>
<p class="text-sm text-muted" style="margin-top:-.5rem;">
  {{ event.event_date.strftime('%B %d, %Y') if event.event_date else '' }}
</p>

<div class="card" style="padding:0; overflow:hidden;">
  <svg id="print-canvas" width="900" height="650"
       style="display:block; width:100%; max-width:900px; height:650px; background:var(--white);">
    <g id="tables-layer"></g>
  </svg>
</div>

<style media="print">
  .site-header, .nav, .site-footer, .flash-list { display: none !important; }
  .page { max-width: none !important; padding: 0 !important; margin: 0 !important; }
  .page-header a, .btn { display: none !important; }
  #print-canvas { width: 100% !important; height: 7.5in !important; max-width: none !important; }
  .card { box-shadow: none !important; margin: 0 !important; padding: 0 !important; border: none !important; }
</style>

<script id="table-layout-data" type="application/json">{{ arrangements|tojson }}</script>
<script src="{{ url_for('static', filename='js/table_layout_geometry.js') }}"></script>
<script src="{{ url_for('static', filename='js/table_layout_render.js') }}"></script>
<script>
  (function () {
    const tables = JSON.parse(document.getElementById('table-layout-data').textContent);
    const svg = document.getElementById('print-canvas');
    const layer = document.getElementById('tables-layer');

    for (const table of tables) {
      layer.appendChild(TableRender.renderTable(table, { interactive: false }));
    }

    // Static fit-to-view -- same bounding-radius approach as the editor,
    // just computed once with no pan/zoom interaction.
    if (tables.length > 0) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const t of tables) {
        const footprint = TableGeometry.tableFootprint(t.shape, t.seats);
        const margin = TableGeometry.seatOffset + 10;
        const r = t.shape === 'round'
          ? footprint.radius + margin
          : Math.hypot(footprint.halfLength + margin, footprint.halfWidth + margin);
        minX = Math.min(minX, t.x - r);
        maxX = Math.max(maxX, t.x + r);
        minY = Math.min(minY, t.y - r);
        maxY = Math.max(maxY, t.y + r);
      }
      const pad = 60;
      svg.setAttribute('viewBox',
        `${minX - pad} ${minY - pad} ${maxX - minX + pad * 2} ${maxY - minY + pad * 2}`);
    }
  })();

  function printLayout() {
    // Same signal used by the main print/export page's "Print this view"
    // button -- the browser's print dialog after window.print() is
    // invisible to the server, so this click is the only signal
    // available. This event's "① Visual chart" slot on that page IS
    // this print for a Custom Table Plan event (see
    // Event.charts_visual_is_current() and the gate in print_seating()).
    fetch("{{ url_for('seating.mark_charts_printed', event_id=event.id) }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ which: "visual" })
    });
    window.print();
  }
</script>

{% endblock %}
