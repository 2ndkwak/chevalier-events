{% extends "base.html" %}
{% block title %}Forgot Password — Chevalier Events{% endblock %}

{% block content %}
<div style="max-width:420px; margin:2.5rem auto;">

  <div style="text-align:center; margin-bottom:1.8rem;">
    <img src="{{ url_for('static', filename='img/Chevalier_Logo.jpg') }}"
         alt="Confrérie des Chevaliers du Tastevin"
         style="height:100px; width:auto; filter:drop-shadow(0 4px 10px rgba(30,18,8,.25));">
  </div>

  <div class="card" style="border-top-color:var(--gold);">
    <div style="text-align:center; margin-bottom:1.2rem;">
      <h1 style="font-size:1.2rem; color:var(--burgundy); margin-bottom:.3rem;">
        Forgot your password?
      </h1>
      <p class="text-muted text-sm">
        Enter your email and we'll send you a link to reset it.
      </p>
    </div>

    <form method="POST">
      <div class="form-group" style="margin-bottom:1.2rem;">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:.6rem;">
        Send reset link
      </button>
    </form>
  </div>

  <p style="text-align:center; font-size:.85rem; margin-top:1rem;">
    <a href="{{ url_for('auth.login') }}" style="color:var(--burgundy);">Back to sign in</a>
  </p>
</div>
{% endblock %}
