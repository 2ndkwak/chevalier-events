{% extends "base.html" %}
{% block title %}Activate your account — Chevalier Events{% endblock %}

{% block content %}
<div style="max-width:440px; margin:3rem auto;">
  <div class="card">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <img src="{{ url_for('static', filename='img/Chevalier_Logo.jpg') }}"
           alt="Chevalier Logo" style="height:72px; margin-bottom:1rem;">
      <h1 style="font-size:1.3rem; color:var(--burgundy); margin-bottom:.3rem;">
        Welcome, {{ person.first_name }}
      </h1>
      <p class="text-muted text-sm">
        Set a password to activate your member portal account.
      </p>
    </div>

    <form method="POST">
      <div class="form-group">
        <label for="password">Password <span style="color:var(--danger);">*</span></label>
        <input type="password" id="password" name="password"
               required minlength="8" autocomplete="new-password"
               placeholder="At least 8 characters">
      </div>
      <div class="form-group">
        <label for="password2">Confirm password <span style="color:var(--danger);">*</span></label>
        <input type="password" id="password2" name="password2"
               required minlength="8" autocomplete="new-password"
               placeholder="Repeat your password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:.5rem;">
        Activate my account
      </button>
    </form>
  </div>

  <p class="text-muted text-sm" style="text-align:center; margin-top:1rem;">
    Already have an account?
    <a href="{{ url_for('auth.login') }}" style="color:var(--burgundy);">Sign in</a>
  </p>
</div>
{% endblock %}
