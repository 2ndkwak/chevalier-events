{% extends "base.html" %}
{% block title %}Change Password — Chevalier Events{% endblock %}

{% block content %}
<div style="max-width:420px; margin:2rem auto;">
  <div class="page-header"><h1>Change password</h1></div>
  <div class="card">
    <form method="POST" action="{{ url_for('portal.change_password') }}">
      <div class="form-group" style="margin-bottom:1rem;">
        <label for="current_password">Current password</label>
        <input type="password" id="current_password" name="current_password" required autofocus>
      </div>
      <div class="form-group" style="margin-bottom:1rem;">
        <label for="new_password">New password (min. 8 characters)</label>
        <input type="password" id="new_password" name="new_password" required minlength="8">
      </div>
      <div class="form-group" style="margin-bottom:1.5rem;">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
      </div>
      <div class="flex gap-1">
        <button type="submit" class="btn btn-primary">Update password</button>
        <a href="{{ url_for('portal.home') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
